<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title>
</head>
<link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/31c2cbdeed.js" crossorigin="anonymous"></script>
<body class="form">

<div class="form-box">
<h2 class="h2">Enter Your Information</h2>

<label class="label">Name</label>
<input type="text" id="name" class="input">

<label class="label">Age</label>
<input type="number" id="age"class="input">
<label class="label">Email</label>
<input type="email" id="email"class="input">
<div id="email-error"></div>
<!-- هنخليه يختار بين النوعين عادي بدل ما يكتب هو -->
<label class="label">Gender</label>
<select id="gender" class="select">
  <option value="" disabled selected>Select Gender</option>
  <option>Male</option>
  <option>Female</option>
</select>
    <button onclick="submitForm()" class="continue-btn">Continue</button>
</div>

<div id="toastBox"></div>
<!-- بمجرد ما يعمل سبمت هتتربط بال api  -->




<!--الجزء بتاع ال script-->
<script>
const API_URL = "https://691f50aabb52a1db22c144f0.mockapi.io/API/V1/users";

const emailInput = document.getElementById("email");
const emailError = document.getElementById("email-error");
const toastBox=document.getElementById("toastBox");


function showtoast(msg){
     let toast=document.createElement('div');
    toast.classList.add('toast');
    toast.innerHTML=msg;
    toastBox.appendChild(toast);

if(msg.includes('error')){
 toast.classList.add('error');
 }
    if(msg.includes('success')){
 toast.classList.add('success');
 }
 setTimeout(()=>{ 
   toast.remove();
   },6000);
    }

//هنا بيتأكد من الايميل
function validateEmail() {
    const email = emailInput.value.trim();
if (!email.endsWith("@gmail.com")) {
        emailError.textContent = "Email must end with @gmail.com";
        emailError.style.display = "block";
        return false;
    }
    emailError.style.display = "none";
    return true;
}    



async function submitForm() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value.trim();
    const gender = document.getElementById("gender").value;
    const email = document.getElementById("email").value.trim();
    const urlParams = new URLSearchParams(window.location.search);
    const competition = urlParams.get("competition");
    const nextPage = urlParams.get("next");


  
// لو اليوزر مدخلش كل البيانات يظهرله المسدج دي ومش ينقله في الصفحة اللي يعدها غير لما يكتب كل البيانات صح
    if (!name || !age || !gender || !email) {
        msg:'error';
        showtoast("⚠️error: Please fill all fields.");
        return;
    }
    //لو اليوزر دخا قيمة غير string تطلعله النسدج ايرور دي
    if (!isNaN(name)) {
    showtoast("⚠️error: Name must be text, not numbers");
    return;
}

    // لو عمره تحت 0 يقوله لازم عمرك يبقى pisitive
     if(age<=0){ 
    msg:'error';
    showtoast("⚠️error: invalid number the age should be positive"); // برده مش ينقله للصفحة اللي بعدها
    return;
}
//لو دخل ايميل مش بينتهي ب @gmail.com
if (!validateEmail()) {
    showtoast("⚠️error: Email must end with @gmail.com");
    return false;
}
     
 
    const newUser = {
        NAME: name,
        AGE: Number(age),
        GENDER: gender,
        COMPETITIon: competition,
        EMAIL: email,
        
    };

    await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newUser)
    });

    // بعد ما دخل كل البيانات تمام تظهرله المسدج دي وينقله للصفحة اللي بعدها
    showtoast("success: Data submitted successfully!");
    setTimeout(() => {
    window.location.href = nextPage;
}, 6000);
   
}
    </script>
    

</body>
</html>
