<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Passport</title>
    <link rel="stylesheet" href="style.css"> <!--ربط صفحة ال HTML بال CSS-->
    
</head>
<body>

    <header id="header">
        <h1 class="h_header">Future Passport 🧑‍🎓</h1>
        <div>
            <nav id="things">
                <a href="Future_passport.html">Home</a>
            </nav>
        </div>
    </header>

                <div class="actions">   
                    <button id="add-btn">Add New Candidate</button>
                </div>

    <table border="3" class="data-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Competition</th>
                <th>Email</th>
            
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ahmed</td>
                <td>18</td>
                <td>Male</td>
                <td>ICPC</td>
                <td>Ahmed@gmail.com</td>
              
                <td>
                    <button onclick="editCandidate(this)" class="edit">Edit</button>
                    <button onclick="deleteCandidate(this)" class="delete">Delete</button>
                </td>
            </tr>

            <tr>
                <td>Mariam</td>
                <td>23</td>
                <td>Female</td>
                <td>ITI</td>
                <td>Mariam@gmail.com</td>
               
                <td>
                    <button onclick="editCandidate(this)" class="edit">Edit</button>
                    <button onclick="deleteCandidate(this)" class="delete">Delete</button>
                </td>
            </tr>
        </tbody>
    </table> 
                 

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Edit Candidate Details</h2>

            <input type="text" id="editNameInput" placeholder="Name">
            <input type="number" id="editAgeInput" placeholder="Age">
            <label></label>
            <select id="editGenderInput">
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            </select>
            <input type="text" id="editCompetitionInput" placeholder="competition">
          

            <div class="modal-buttons">
                <button onclick="saveChanges()" class="btn-save">Save</button>
                <button onclick="closeModal()" class="btn-cancel">Cancel</button>
            </div>
        </div>
    </div>
    
    
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add New Candidate</h2>

            <input type="text" id="name" placeholder="Name" required>
            <input type="number" id="age" placeholder="Age" required>
            <input type="email" id="email" placeholder="Email" required>
            <label></label>
            <select id="gender">
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            </select>
            <input type="text" id="competition" placeholder="Competition" required>
            
            
            <div class="modal-buttons">
                <button id="save-btn">Save</button>
          <button id="cancel-btn" class="delete">cancel</button>
            </div>
        </div>        
    </div>

   
<div id="deleteModal" class="modal">
  <div class="modal-">
    <p>Are you sure you want to delete this candidate?</p>
    <button id="confirmDeleteBtn">Yes, Delete</button>
    <button id="cancelDeleteBtn">Cancel</button>
  </div>
</div>

    <div id="toastBox"></div>
    
   

    <script src="dashboard.js"></script> <!--ربط html ب javascript-->



</body>
</html>
